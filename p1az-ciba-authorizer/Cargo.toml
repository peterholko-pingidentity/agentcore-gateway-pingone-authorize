[package]
name = "aws-bedrock-lambda-authorizer"
version = "0.1.1"
edition = "2021"

[dependencies]
base64 = "0.22"
lambda_runtime = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "time"] }
tracing = { version = "0.1", features = ["log"] }
# CIBA approval flow (this fork): request fingerprints, the sealed MCP requestState,
# and DynamoDB calls signed with SigV4 over the existing reqwest client instead of
# the full AWS SDK.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aws-sigv4 = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }

[dev-dependencies]
wiremock = "0.6"
url = "2"

[[bin]]
name = "bedrock"
path = "src/bin/bedrock.rs"
